[project]
name = "dehydrator"
version = "0.1.0"
description = "把音频或视频转成脱水稿"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "av>=14",
    "httpx>=0.28",
    "jinja2>=3.1",
    "mcp>=1.20,<2",
    "openai>=1.80",
    "platformdirs>=4.3",
    "pydantic>=2.11",
    "python-dotenv>=1.2.4",
    "rich>=14",
    "tomli-w>=1.2",
    "typer>=0.16",
]

[project.scripts]
dehydrator = "dehydrator.cli.app:main"
dehydrator-mcp = "dehydrator.mcp_server:main"

[dependency-groups]
dev = [
    "basedpyright>=1.29",
    "import-linter>=2.3",
    "numpy>=2.5.4",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "ASYNC", "C4", "RET"]
# 中文全角标点出现在文档字符串和注释里是正常的
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

# PyAV 的类型标注不完整。adapters 是隔离第三方库的边界，
# 只在这里放宽"未知类型"检查；其余规则仍按 strict 执行。
[[tool.basedpyright.executionEnvironments]]
root = "src/dehydrator/adapters"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[[tool.basedpyright.executionEnvironments]]
root = "tests/adapters"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.importlinter]
root_package = "dehydrator"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "分层：上层可以依赖下层，反之不行"
type = "layers"
layers = [
    "dehydrator.cli",
    "dehydrator.service",
    "dehydrator.bootstrap",
    "dehydrator.config",
    "dehydrator.pipeline | dehydrator.adapters",
    "dehydrator.ports",
    "dehydrator.domain",
]

[[tool.importlinter.contracts]]
name = "IO 与外部服务的库只能出现在 adapters 中"
type = "forbidden"
source_modules = ["dehydrator.domain", "dehydrator.ports", "dehydrator.pipeline"]
forbidden_modules = ["av", "openai", "httpx"]
